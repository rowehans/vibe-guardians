name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run every guardian suite
        run: npm test

      - name: Verify what would be published
        run: npm pack --dry-run

      - name: Fail if LICENSE would not ship
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('/tmp/pack.json','utf8'))[0].files.map(f => f.path);
            const required = ['LICENSE', 'README.md', 'package.json'];
            const missing = required.filter(f => !files.includes(f));
            if (missing.length) { console.error('Missing from tarball:', missing.join(', ')); process.exit(1); }
            console.log('Tarball ok:', files.length, 'files, LICENSE present');
          "
